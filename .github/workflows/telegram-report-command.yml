name: Telegram report command

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: telegram-report-command
  cancel-in-progress: false

jobs:
  poll-command:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read /report commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/telegram-report-command.mjs
      - name: Save command cursor
        run: |
          if git diff --quiet -- .github/telegram-command-state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/telegram-command-state.json
          git commit -m "chore: record Telegram command offset"
          git push
