name: Cloud source validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            chrome: /usr/bin/google-chrome
          - os: macos-14
            chrome: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    timeout-minutes: 12
    defaults:
      run:
        working-directory: market-six-indicators
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Verify six sources without sending
        env:
          DRY_RUN: '1'
          CHROME_EXECUTABLE_PATH: ${{ matrix.chrome }}
          REPORT_OUTPUT_FILE: cloud-preview.txt
          REPORT_AUDIT_FILE: cloud-audit.json
        run: npm run report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-source-check-${{ matrix.os }}
          path: |
            market-six-indicators/cloud-preview.txt
            market-six-indicators/cloud-audit.json
